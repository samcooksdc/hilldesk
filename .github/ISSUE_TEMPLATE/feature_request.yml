name: Feature request
description: Suggest something that would help a scheduling office
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve for an office?
      description: Describe the workflow today and where it hurts. No real data, please.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like HillDesk to do?
  - type: checkboxes
    id: principles
    attributes:
      label: Fit with project principles
      options:
        - label: A person still approves every outcome (the AI only suggests)
          required: true
        - label: It works without public internet and without non-Bedrock AI in production
