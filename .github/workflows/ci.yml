# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests and Django checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt
      - name: Install
        run: pip install -r requirements.lock -r requirements-dev.txt
      - name: System check
        run: python manage.py check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.testing
      - name: Migrations are complete and stable
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.testing
      - name: Test suite
        run: python manage.py test --settings=config.settings.testing --noinput

  production-boot:
    name: Production settings boot (dummy secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - name: Refuses to start without secrets
        run: |
          if DJANGO_SETTINGS_MODULE=config.settings.production python -c "import django; django.setup()"; then
            echo "production settings started without SECRET_KEY" && exit 1
          fi
      - name: Deploy checks with dummy secrets
        run: |
          python manage.py check --deploy
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          SECRET_KEY: ci-only-${{ github.run_id }}-not-a-real-secret-value-0123456789
          FIELD_ENCRYPTION_KEY: ci-only-field-key-${{ github.run_id }}
          ALLOWED_HOSTS: hilldesk.example.com
          CSRF_TRUSTED_ORIGINS: https://hilldesk.example.com
          CORS_ALLOWED_ORIGINS: https://hilldesk.example.com

  lint-and-security:
    name: Lint and security scans
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff (bug-class rules; see pyproject.toml)
        run: ruff check .
      - name: Bandit (medium severity and up)
        run: bandit -q -r apps config -c pyproject.toml -ll
      - name: Dependency vulnerabilities
        run: pip-audit -r requirements.lock
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t hilldesk:ci .
