<!-- Email Response Modal -->
<div class="modal fade" id="emailResponseModal" tabindex="-1" aria-labelledby="emailResponseModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="emailResponseModalLabel">Send Email Response</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="emailResponseForm">
                    {% csrf_token %}
                    <input type="hidden" id="emailId" name="email_id" value="">
                    
                    <!-- Template Selection -->
                    <div class="mb-3">
                        <label for="templateSelect" class="form-label">Email Template</label>
                        <select class="form-select" id="templateSelect" name="template_id" required>
                            <option value="">Select a template...</option>
                            <!-- Templates will be loaded dynamically -->
                        </select>
                        <div class="form-text">Choose a pre-defined template or select "Custom" to write your own response.</div>
                    </div>
                    
                    <!-- Context Variables -->
                    <div id="contextVariables" class="mb-3" style="display: none;">
                        <h6>Template Variables</h6>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-2">
                                    <label for="senderName" class="form-label">Sender Name</label>
                                    <input type="text" class="form-control form-control-sm" id="senderName" name="sender_name" placeholder="John Doe">
                                </div>
                                <div class="mb-2">
                                    <label for="recipientName" class="form-label">Recipient Name</label>
                                    <input type="text" class="form-control form-control-sm" id="recipientName" name="recipient_name" placeholder="Representative Smith">
                                </div>
                                <div class="mb-2">
                                    <label for="officeName" class="form-label">Office Name</label>
                                    <input type="text" class="form-control form-control-sm" id="officeName" name="office_name" placeholder="Congressional Office">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-2">
                                    <label for="eventDate" class="form-label">Event Date</label>
                                    <input type="text" class="form-control form-control-sm" id="eventDate" name="event_date" placeholder="January 15, 2023">
                                </div>
                                <div class="mb-2">
                                    <label for="eventTime" class="form-label">Event Time</label>
                                    <input type="text" class="form-control form-control-sm" id="eventTime" name="event_time" placeholder="2:00 PM - 3:00 PM">
                                </div>
                                <div class="mb-2">
                                    <label for="eventLocation" class="form-label">Event Location</label>
                                    <input type="text" class="form-control form-control-sm" id="eventLocation" name="event_location" placeholder="2411 RHOB">
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Preview Section -->
                    <div id="emailPreview" class="mb-3" style="display: none;">
                        <h6>Email Preview</h6>
                        <div class="card">
                            <div class="card-header bg-light">
                                <strong>Subject:</strong> <span id="previewSubject"></span>
                            </div>
                            <div class="card-body">
                                <div id="previewBody"></div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Custom Email Section -->
                    <div id="customEmailSection" style="display: none;">
                        <div class="mb-3">
                            <label for="customSubject" class="form-label">Subject</label>
                            <input type="text" class="form-control" id="customSubject" name="custom_subject">
                        </div>
                        <div class="mb-3">
                            <label for="customBody" class="form-label">Message</label>
                            <textarea class="form-control" id="customBody" name="custom_body" rows="8"></textarea>
                        </div>
                        <div class="mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="customIsHtml" name="custom_is_html">
                                <label class="form-check-label" for="customIsHtml">
                                    HTML Format
                                </label>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Additional Recipients -->
                    <div class="mb-3">
                        <div class="row">
                            <div class="col-md-6">
                                <label for="ccRecipients" class="form-label">CC Recipients</label>
                                <input type="text" class="form-control" id="ccRecipients" name="cc_recipients" placeholder="email1@example.com, email2@example.com">
                                <div class="form-text">Separate multiple emails with commas</div>
                            </div>
                            <div class="col-md-6">
                                <label for="bccRecipients" class="form-label">BCC Recipients</label>
                                <input type="text" class="form-control" id="bccRecipients" name="bcc_recipients" placeholder="email1@example.com, email2@example.com">
                                <div class="form-text">Separate multiple emails with commas</div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="previewBtn">Preview</button>
                <button type="button" class="btn btn-success" id="sendBtn">Send Response</button>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const modal = document.getElementById('emailResponseModal');
    const templateSelect = document.getElementById('templateSelect');
    const contextVariables = document.getElementById('contextVariables');
    const emailPreview = document.getElementById('emailPreview');
    const customEmailSection = document.getElementById('customEmailSection');
    const previewBtn = document.getElementById('previewBtn');
    const sendBtn = document.getElementById('sendBtn');
    
    // Load templates when modal is shown
    modal.addEventListener('show.bs.modal', function(event) {
        const button = event.relatedTarget;
        const emailId = button.getAttribute('data-email-id');
        const senderName = button.getAttribute('data-sender-name') || '';
        const originalSubject = button.getAttribute('data-original-subject') || '';
        
        // Set email ID
        document.getElementById('emailId').value = emailId;
        
        // Pre-fill context variables
        document.getElementById('senderName').value = senderName;
        document.getElementById('recipientName').value = '{{ user.get_full_name|default:user.username }}';
        document.getElementById('officeName').value = 'Congressional Office';
        
        // Load available templates
        loadEmailTemplates();
    });
    
    // Handle template selection
    templateSelect.addEventListener('change', function() {
        const selectedValue = this.value;
        
        if (selectedValue === 'custom') {
            contextVariables.style.display = 'none';
            emailPreview.style.display = 'none';
            customEmailSection.style.display = 'block';
        } else if (selectedValue) {
            contextVariables.style.display = 'block';
            customEmailSection.style.display = 'none';
            // Auto-preview when template is selected
            previewTemplate();
        } else {
            contextVariables.style.display = 'none';
            emailPreview.style.display = 'none';
            customEmailSection.style.display = 'none';
        }
    });
    
    // Handle context variable changes
    const contextInputs = contextVariables.querySelectorAll('input');
    contextInputs.forEach(input => {
        input.addEventListener('input', debounce(previewTemplate, 500));
    });
    
    // Preview button
    previewBtn.addEventListener('click', previewTemplate);
    
    // Send button
    sendBtn.addEventListener('click', sendEmailResponse);
    
    function loadEmailTemplates() {
        // Add custom option
        templateSelect.innerHTML = '<option value="">Select a template...</option>';
        templateSelect.innerHTML += '<option value="custom">Custom Email</option>';
        
        // In a real implementation, this would fetch templates from the server
        // For now, add some sample templates
        const sampleTemplates = [
            { id: 'accept', name: 'Meeting Accepted', category: 'accept' },
            { id: 'decline', name: 'Meeting Declined', category: 'decline' },
            { id: 'reschedule', name: 'Meeting Rescheduling Request', category: 'reschedule' },
            { id: 'acknowledge', name: 'Meeting Acknowledgment', category: 'acknowledge' }
        ];
        
        sampleTemplates.forEach(template => {
            const option = document.createElement('option');
            option.value = template.id;
            option.textContent = template.name;
            templateSelect.appendChild(option);
        });
    }
    
    function previewTemplate() {
        const templateId = templateSelect.value;
        if (!templateId || templateId === 'custom') return;
        
        // Collect context data
        const contextData = {};
        contextInputs.forEach(input => {
            contextData[input.name] = input.value;
        });
        
        // In a real implementation, this would make an AJAX call to preview the template
        // For now, show a sample preview
        document.getElementById('previewSubject').textContent = `RE: Meeting Request - Response`;
        document.getElementById('previewBody').innerHTML = `
            <p>Dear ${contextData.sender_name || 'Constituent'},</p>
            <p>Thank you for your email. This is a sample preview of the selected template.</p>
            <p>Best regards,<br>${contextData.recipient_name || 'Staff Member'}</p>
        `;
        
        emailPreview.style.display = 'block';
    }
    
    function sendEmailResponse() {
        const form = document.getElementById('emailResponseForm');
        const formData = new FormData(form);
        
        // Disable send button
        sendBtn.disabled = true;
        sendBtn.textContent = 'Sending...';
        
        // In a real implementation, this would make an AJAX call to send the email
        // For now, show a success message
        setTimeout(() => {
            alert('Email response sent successfully!');
            bootstrap.Modal.getInstance(modal).hide();
            
            // Reset button
            sendBtn.disabled = false;
            sendBtn.textContent = 'Send Response';
        }, 1000);
    }
    
    function debounce(func, wait) {
        let timeout;
        return function executedFunction(...args) {
            const later = () => {
                clearTimeout(timeout);
                func(...args);
            };
            clearTimeout(timeout);
            timeout = setTimeout(later, wait);
        };
    }
});
</script>
