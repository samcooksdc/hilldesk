{% comment %}Empty state shown in the detail panel before a row is selected.{% endcomment %}
<div class="detail-panel-empty">
    <svg class="detail-panel-empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
        <circle cx="9" cy="7" r="4"></circle>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
    </svg>
    <p class="detail-panel-empty-title">No {% if kind == 'organizations'%}organization{% else %}contact{% endif %} selected</p>
    <p class="detail-panel-empty-subtitle">Select a {% if kind == 'organizations'%}organization{% else %}contact{% endif %} from the list to see its details.</p>
</div>
