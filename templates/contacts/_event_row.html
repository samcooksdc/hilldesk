{% comment %}One linked-event row (expects `link` in context). Opens the EEM on click.{% endcomment %}
<div class="overlap-item" role="button" tabindex="0"
     data-event-id="{{ link.event.id }}"
     data-href="{% url 'event_management:event_detail' link.event.id %}"
     aria-label="Open {{ link.event.title|default:'event' }}">
    <span class="cdp-item-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg></span>
    <span class="overlap-title">{{ link.event.title|default:'Untitled event' }}</span>
    <span class="overlap-time">{% if link.event.start_date %}{{ link.event.start_date|date:"M j, Y" }}{% endif %}</span>
    <span class="detail-panel-status status-{{ link.event.status|default:'received' }}">{{ link.event.get_status_display_from_office }}</span>
</div>
